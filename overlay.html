<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>BODYCAM</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
}

body {
  font-family: "Roboto Condensed", Arial, sans-serif;
  color: #fff;
}


/* =========================
   MAIN OVERLAY
   ========================= */

.wrap {
  position: absolute;
  top: 22px;
  left: 22px;

  font-weight: 700;
  letter-spacing: .6px;

  /* SOFT BLACK SHADOW */
  text-shadow:
    0 2px 3px rgba(0, 0, 0, 0.95),
    0 4px 8px rgba(0, 0, 0, 0.75),
    0 7px 14px rgba(0, 0, 0, 0.50);
}


/* =========================
   REC + BODYCAM
   ========================= */

.top-line {
  display: flex;
  align-items: center;
  gap: 14px;

  font-size: 19px;
  font-weight: 800;
}


/* REC */

.rec {
  color: #ff3030;

  font-weight: 800;

  text-shadow:
    0 2px 3px rgba(0, 0, 0, 0.95),
    0 4px 8px rgba(0, 0, 0, 0.75),
    0 7px 14px rgba(0, 0, 0, 0.50);
}


/* REC DOT */

.rec-dot {
  display: inline-block;
  color: #ff3030;

  animation: recBlink 1s infinite;
}


/* BODYCAM */

.brand {
  color: #fff;

  font-size: 19px;
  font-weight: 800;

  letter-spacing: 2.5px;

  text-shadow:
    0 2px 3px rgba(0, 0, 0, 0.95),
    0 4px 8px rgba(0, 0, 0, 0.75),
    0 7px 14px rgba(0, 0, 0, 0.50);
}


/* =========================
   PLAYER
   ========================= */

.info {
  font-size: 16px;
  font-weight: 600;

  margin-top: 4px;

  letter-spacing: .7px;

  text-shadow:
    0 2px 3px rgba(0, 0, 0, 0.95),
    0 4px 8px rgba(0, 0, 0, 0.75),
    0 7px 14px rgba(0, 0, 0, 0.50);
}


/* =========================
   DATE / TIME
   ========================= */

.clock {
  font-size: 19px;
  font-weight: 500;

  margin-top: 5px;

  letter-spacing: .8px;

  text-shadow:
    0 2px 3px rgba(0, 0, 0, 0.95),
    0 4px 8px rgba(0, 0, 0, 0.75),
    0 7px 14px rgba(0, 0, 0, 0.50);
}


/* =========================
   REC BLINK
   ========================= */

@keyframes recBlink {

  0%,
  45% {
    opacity: 1;

    text-shadow:
      0 2px 3px rgba(0, 0, 0, 0.95),
      0 4px 8px rgba(0, 0, 0, 0.75),
      0 7px 14px rgba(0, 0, 0, 0.50);
  }

  50%,
  100% {
    opacity: .25;

    text-shadow:
      0 2px 3px rgba(0, 0, 0, 0.95),
      0 4px 8px rgba(0, 0, 0, 0.65);
  }
}

</style>
</head>

<body>

<div id="app" class="wrap"></div>

<script>

const q = new URLSearchParams(location.search);

const player = q.get("player");


/* Escape HTML */

function escapeHtml(s) {

  return String(s).replace(/[&<>"']/g, function(c) {

    return {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[c];

  });

}


/* Check player */

if (!player) {

  document.getElementById("app").innerHTML =
    '<div>Invalid Bodycam overlay URL.</div>';

} else {

  document.getElementById("app").innerHTML = `

    <div class="top-line">

      <span class="rec">
        <span class="rec-dot">●</span> REC
      </span>

      <span class="brand">
        BODYCAM
      </span>

    </div>


    <div class="info">
      PLAYER: ${escapeHtml(player)}
    </div>


    <div id="clock" class="clock">
      --/--/---- --:--:--
    </div>

  `;


  /* Live date and time */

  function updateClock() {

    const now = new Date();

    document.getElementById("clock").textContent =
      now.toLocaleDateString() +
      " " +
      now.toLocaleTimeString();

  }


  updateClock();

  setInterval(updateClock, 1000);

}

</script>

</body>
</html>
