```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>BODYCAM</title>

<style>
html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  color: #fff;
}

/* Main overlay */
.wrap {
  position: absolute;
  top: 22px;
  left: 22px;

  font-weight: 800;
  letter-spacing: .4px;

  /* Black shadow behind all text */
  text-shadow:
    2px 2px 0 #000,
    -2px -2px 0 #000,
    2px -2px 0 #000,
    -2px 2px 0 #000,
    0 3px 7px rgba(0,0,0,.95);
}

/* First line */
.top-line {
  display: flex;
  align-items: center;
  gap: 14px;

  font-size: 18px;
}

/* REC */
.rec {
  color: #ff3030;
}

/* Blinking REC dot */
.rec-dot {
  display: inline-block;
  color: #ff3030;

  animation: recBlink 1s infinite;
}

/* BODYCAM */
.brand {
  color: #fff;
  letter-spacing: 2px;
  font-size: 18px;
}

/* Player / Department */
.info {
  font-size: 15px;
  margin-top: 4px;
}

/* Date / Time */
.clock {
  font-size: 14px;
  margin-top: 5px;
}


/* REC blinking animation */
@keyframes recBlink {

  0%,
  45% {
    opacity: 1;

    text-shadow:
      0 0 4px #ff3030,
      0 0 8px #ff3030,
      0 0 14px #ff3030,
      2px 2px 0 #000;
  }

  50%,
  100% {
    opacity: .25;

    text-shadow:
      2px 2px 0 #000;
  }
}
</style>
</head>

<body>

<div id="app" class="wrap"></div>

<script>

const q = new URLSearchParams(location.search);

const player = q.get("player");

const department =
  q.get("department") || "CIVILIAN";


/* Escape HTML */
function escapeHtml(s) {

  return String(s).replace(/[&<>"']/g, function(c) {

    return {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[c];

  });
}


/* Check player name */
if (!player) {

  document.getElementById("app").innerHTML =
    '<div>Invalid Bodycam overlay URL.</div>';

} else {

  document.getElementById("app").innerHTML = `

    <!-- LINE 1: REC + BODYCAM -->
    <div class="top-line">

      <span class="rec">
        <span class="rec-dot">●</span> REC
      </span>

      <span class="brand">
        BODYCAM
      </span>

    </div>


    <!-- LINE 2: PLAYER -->
    <div class="info">
      PLAYER: ${escapeHtml(player)}
    </div>


    <!-- LINE 3: DEPARTMENT -->
    <div class="info">
      DEPT: ${escapeHtml(department)}
    </div>


    <!-- LINE 4: DATE / TIME -->
    <div id="clock" class="clock">
      --/--/---- --:--:--
    </div>

  `;


  /* Live date and time */
  function updateClock() {

    const now = new Date();

    document.getElementById("clock").textContent =
      now.toLocaleDateString() +
      " " +
      now.toLocaleTimeString();

  }


  updateClock();

  setInterval(updateClock, 1000);

}

</script>

</body>
</html>
```
