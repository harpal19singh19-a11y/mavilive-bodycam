```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bodycam</title>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
}

body {
  font-family: Arial, sans-serif;
  color: #fff;
}

/* BODYCAM overlay position */
.wrap {
  position: absolute;
  top: 22px;
  left: 22px;
  font-weight: 800;
  letter-spacing: .4px;

  /* Strong shadow behind ALL text */
  text-shadow:
    2px 2px 0 #000,
    -2px -2px 0 #000,
    2px -2px 0 #000,
    -2px 2px 0 #000,
    0 3px 6px rgba(0,0,0,0.95);
}

.line {
  margin: 3px 0;
}

/* REC indicator */
.rec {
  color: #ff3030;
  text-shadow:
    2px 2px 0 #000,
    -2px -2px 0 #000,
    0 3px 6px rgba(0,0,0,0.95);
}

/* BODYCAM title */
.brand {
  font-size: 20px;
  letter-spacing: 2px;
}

/* Player / Department / Date */
.info {
  font-size: 15px;
}

/* Error message */
.err {
  font: 700 20px Arial;
  color: #fff;
  background: rgba(0,0,0,.78);
  padding: 16px;
  border-radius: 8px;

  text-shadow:
    2px 2px 0 #000,
    -2px -2px 0 #000,
    0 3px 6px rgba(0,0,0,0.95);
}
</style>
</head>

<body>

<div id="app" class="wrap"></div>

<script>
const q = new URLSearchParams(location.search);

const player = q.get("player");
const department = q.get("department") || "CIVILIAN";

if (!player) {

  document.getElementById("app").innerHTML =
    '<div class="err">Invalid Bodycam overlay URL.<br>' +
    '<small>Generate a new OBS URL from the website.</small></div>';

} else {

  document.getElementById("app").innerHTML = `
    <!-- REC WITHOUT COUNTDOWN -->
    <div class="line">
      <span class="rec">● REC</span>
    </div>

    <!-- LIVE DATE / TIME -->
    <div id="clock" class="line info"></div>

    <!-- BODYCAM -->
    <div class="line brand">BODYCAM</div>

    <!-- PLAYER -->
    <div class="line info">
      PLAYER: ${escapeHtml(player)}
    </div>

    <!-- DEPARTMENT -->
    <div class="line info">
      DEPT: ${escapeHtml(department)}
    </div>
  `;

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[c]));
  }

  function updateClock() {
    const now = new Date();

    document.getElementById("clock").textContent =
      now.toLocaleDateString() + " " +
      now.toLocaleTimeString();
  }

  updateClock();

  // Update date/time every second
  setInterval(updateClock, 1000);
}
</script>

</body>
</html>
```
