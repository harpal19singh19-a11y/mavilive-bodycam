<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MAVILIVE Overlay</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
body{font-family:Arial,Helvetica,sans-serif;color:#fff}
#cam{position:absolute;top:24px;right:28px;text-align:right;text-shadow:0 2px 5px #000;font-weight:700}
.rec{font-size:18px;letter-spacing:1px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#e50914;margin-right:6px;animation:blink 1s infinite}
.timer{font-size:17px;margin-left:5px}.brand{font-size:18px;letter-spacing:2px;margin-top:4px}.brand span{color:#e50914}
.info{font-size:14px;margin-top:4px}.time{font-size:13px;margin-top:4px;color:#ddd}
@keyframes blink{50%{opacity:.25}}
</style>
</head>
<body>
<div id="cam">
<div class="rec"><span class="dot"></span>REC <span class="timer" id="timer">00:00:00</span></div>
<div class="brand">MAVI<span>LIVE</span></div>
<div class="info"><span id="player"></span> — <span id="department"></span></div>
<div class="time" id="dateTime"></div>
</div>
<script>
const id=new URLSearchParams(location.search).get('id');
let data=null;
try{data=JSON.parse(localStorage.getItem('mavilive_'+id)||'null')}catch(e){}
if(!data){document.getElementById('cam').innerHTML='<div>Invalid or expired MAVILIVE overlay.</div>'}
else{
 document.getElementById('player').textContent=data.player;
 document.getElementById('department').textContent=data.department||'CIVILIAN';
 const start=data.startedAt||Date.now();
 function update(){
  let s=Math.floor((Date.now()-start)/1000),h=Math.floor(s/3600);s%=3600;
  let m=Math.floor(s/60);s%=60;
  document.getElementById('timer').textContent=[h,m,s].map(x=>String(x).padStart(2,'0')).join(':');
  document.getElementById('dateTime').textContent=new Date().toLocaleString();
 }
 update();setInterval(update,1000);
}
</script>
</body>
</html>
