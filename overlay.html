```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BODYCAM Overlay</title>

<style>
html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  color: #fff;
}

/* Main overlay */
.wrap {
  position: absolute;
  top: 22px;
  left: 22px;

  font-weight: 800;
  letter-spacing: 0.4px;

  /* Strong black shadow behind text */
  text-shadow:
    2px 2px 0 #000,
    -2px -2px 0 #000,
    2px -2px 0 #000,
    -2px 2px 0 #000,
    0 3px 7px rgba(0, 0, 0, 0.95);
}

/* Each line */
.line {
  margin: 3px 0;
}

/* REC text */
.rec {
  color: #ff3030;

  text-shadow:
    2px 2px 0 #000,
    -2px -2px 0 #000,
    2px -2px 0 #000,
    -2px 2px 0 #000,
    0 3px 7px rgba(0, 0, 0, 0.95);
}

/* Blinking red REC dot */
.rec-dot {
  display: inline-block;
  color: #ff3030;

  animation: recBlink 1s infinite;
}

/* Realistic recording blink */
@keyframes recBlink {

  0%,
  45% {
    opacity: 1;

    text-shadow:
      0 0 3px #ff3030,
      0 0 7px #ff3030,
      0 0 12px rgba(255, 48, 48, 0.8),
      2px 2px 0 #000;
  }

  50%,
  100% {
    opacity: 0.25;

    text-shadow:
      2px 2px 0 #000;
  }
}

/* Date / time / player / department */
.info {
  font-size: 15px;
}

/* BODYCAM title */
.brand {
  font-size: 20px;
  letter-spacing: 2px;
}

/* Error box */
.err {
  font: 700 20px Arial, Helvetica, sans-serif;
  color: #fff;

  background: rgba(0, 0, 0, 0.78);

  padding: 16px;
  border-radius: 8px;

  text-shadow:
    2px 2px 0 #000,
    -2px -2px 0 #000,
    0 3px 7px rgba(0, 0, 0, 0.95);
}
</style>
</head>

<body>

<div id="app" class="wrap"></div>

<script>
const q = new URLSearchParams(location.search);

const player = q.get("player");
const department = q.get("department") || "CIVILIAN";

/* Check player name */
if (!player) {

  document.getElementById("app").innerHTML =
    '<div class="err">' +
    'Invalid Bodycam overlay URL.<br>' +
    '<small>Generate a new OBS URL from the website.</small>' +
    '</div>';

} else {

  /* BODYCAM overlay */
  document.getElementById("app").innerHTML = `

    <!-- RECORDING INDICATOR -->
    <div class="line">
      <span class="rec">
        <span class="rec-dot">●</span> REC
      </span>
    </div>

    <!-- LIVE DATE AND TIME -->
    <div id="clock" class="line info"></div>

    <!-- BODYCAM TITLE -->
    <div class="line brand">
      BODYCAM
    </div>

    <!-- PLAYER NAME -->
    <div class="line info">
      PLAYER: ${escapeHtml(player)}
    </div>

    <!-- DEPARTMENT -->
    <div class="line info">
      DEPT: ${escapeHtml(department)}
    </div>

  `;

  /* Protect text from HTML injection */
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function(c) {
      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[c];
    });
  }

  /* Live date/time */
  function updateClock() {

    const now = new Date();

    document.getElementById("clock").textContent =
      now.toLocaleDateString() +
      " " +
      now.toLocaleTimeString();

  }

  /* Start clock */
  updateClock();

  /* Update every second */
  setInterval(updateClock, 1000);
}
</script>

</body>
</html>
```
