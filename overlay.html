<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bodycam</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
body{font-family:Arial,sans-serif;color:#fff;text-shadow:0 2px 4px #000}
.wrap{position:absolute;top:22px;left:22px;font-weight:800;letter-spacing:.4px}
.line{margin:3px 0}.rec{color:#ff3030}.brand{font-size:20px;letter-spacing:2px}.info{font-size:15px}
.timer{font-family:monospace;font-size:17px}
.err{font:700 20px Arial;color:#fff;background:rgba(0,0,0,.78);padding:16px;border-radius:8px}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<script>
const q = new URLSearchParams(location.search);
const player = q.get("player");
const department = q.get("department") || "CIVILIAN";
const startRaw = Number(q.get("start"));

if(!player){
  document.getElementById("app").innerHTML =
    '<div class="err">Invalid Bodycam overlay URL.<br><small>Generate a new OBS URL from the  website.</small></div>';
}else{
  // No expiration is used. The timer continues from the timestamp in the URL.
  const start = Number.isFinite(startRaw) && startRaw > 0 ? startRaw : Date.now();

  document.getElementById("app").innerHTML = `
    <div class="line"><span class="rec">● REC</span> <span id="timer" class="timer">00:00:00</span></div>
    <div id="clock" class="line info"></div>
    <div class="line brand">BODYCAM</div>
    <div class="line info">PLAYER: ${escapeHtml(player)}</div>
    <div class="line info">DEPT: ${escapeHtml(department)}</div>
  `;

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));
  }

  function update(){
    const elapsed = Math.max(0, Math.floor((Date.now()-start)/1000));
    const h = String(Math.floor(elapsed/3600)).padStart(2,"0");
    const m = String(Math.floor((elapsed%3600)/60)).padStart(2,"0");
    const s = String(elapsed%60).padStart(2,"0");
    document.getElementById("timer").textContent = h+":"+m+":"+s;
    document.getElementById("clock").textContent =
      new Date().toLocaleDateString() + " " + new Date().toLocaleTimeString();
  }
  update();
  setInterval(update,1000);
}
</script>
</body>
</html>
