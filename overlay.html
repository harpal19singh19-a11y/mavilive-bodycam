<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAVILIVE Bodycam OBS Generator</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#080a0d;color:#fff}
body{display:flex;align-items:center;justify-content:center;padding:24px}
.wrap{width:min(1100px,100%);display:grid;grid-template-columns:360px 1fr;gap:22px}
.panel,.previewBox{background:#11151a;border:1px solid #2a3139;border-radius:16px;box-shadow:0 20px 60px #0008}
.panel{padding:22px}
h1{font-size:24px;margin:0 0 6px;letter-spacing:1px}
.sub{color:#8e98a3;font-size:13px;margin-bottom:22px}
label{display:block;color:#b8c0c9;font-size:12px;font-weight:700;margin:14px 0 7px;text-transform:uppercase;letter-spacing:.7px}
input{width:100%;height:44px;border-radius:9px;border:1px solid #343d47;background:#090c10;color:#fff;padding:0 12px;font-size:14px;outline:none}
input:focus{border-color:#f22;box-shadow:0 0 0 2px #f222}
button{width:100%;height:44px;border:0;border-radius:9px;font-weight:800;cursor:pointer;margin-top:14px;font-size:13px}
.gen{background:#e50909;color:#fff}
.copy{background:#242b33;color:#fff}
button:active{transform:translateY(1px)}
.url{margin-top:15px;background:#090c10;border:1px solid #303943;border-radius:9px;padding:11px;word-break:break-all;color:#8fd0ff;font-size:11px;min-height:44px}
.note{font-size:11px;color:#727d88;line-height:1.5;margin-top:12px}
.previewBox{padding:18px}
.previewTitle{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#8e98a3;margin:0 0 12px}
.stage{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,#252b31,#11151a 50%,#07090b);border:1px solid #343b43}
.stage:after{content:"LIVE PREVIEW";position:absolute;inset:auto 0 0 0;padding:8px 12px;background:linear-gradient(transparent,#0008);font-size:10px;color:#fff8;letter-spacing:1px}
.cam{position:absolute;inset:0;padding:24px 26px;pointer-events:none}
.top{display:flex;align-items:center;justify-content:space-between}
.brand{font-size:25px;font-weight:1000;letter-spacing:2px;text-shadow:0 2px 6px #000}
.rec{font-size:14px;font-weight:900;letter-spacing:1px;display:flex;align-items:center;gap:7px}
.dot{width:10px;height:10px;border-radius:50%;background:#f00;box-shadow:0 0 12px #f00;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.info{position:absolute;left:26px;bottom:30px;display:flex;flex-direction:column;gap:5px;text-shadow:0 2px 5px #000}
.name{font-size:19px;font-weight:900;letter-spacing:.5px}
.dept{font-size:12px;font-weight:800;color:#ddd;letter-spacing:1.5px}
.time{position:absolute;right:26px;bottom:30px;font-size:12px;font-weight:800;text-shadow:0 2px 5px #000}
.badge{position:absolute;right:26px;top:55px;border:1px solid #fff8;background:#0009;padding:5px 8px;border-radius:4px;font-size:9px;font-weight:900;letter-spacing:1px}
.status{position:absolute;left:26px;top:59px;font-size:9px;color:#fff9;letter-spacing:1px}
@media(max-width:800px){.wrap{grid-template-columns:1fr}.previewBox{order:-1}}
</style>
</head>
<body>
<div class="wrap">
  <section class="panel">
    <h1>🔴 MAVILIVE BODYCAM</h1>
    <div class="sub">OBS Browser Source URL Generator</div>

    <label for="player">Player Name</label>
    <input id="player" placeholder="Enter player name" maxlength="40">

    <label for="department">Department</label>
    <input id="department" placeholder="Police / EMS / Sheriff (optional)" maxlength="40">

    <button class="gen" id="generate">GENERATE OBS URL</button>
    <button class="copy" id="copy">COPY OBS URL</button>

    <div class="url" id="url">Your OBS URL will appear here.</div>
    <div class="note">
      Department automatically becomes <b>CIVILIAN</b> when left empty.
      Use the generated URL directly in OBS as a Browser Source.
      No localStorage is used.
    </div>
  </section>

  <section class="previewBox">
    <div class="previewTitle">Live Preview</div>
    <div class="stage">
      <div class="cam">
        <div class="top">
          <div class="brand">MAVILIVE</div>
          <div class="rec"><span class="dot"></span> REC</div>
        </div>
        <div class="status">BODYCAM // ACTIVE</div>
        <div class="badge">BODYCAM</div>
        <div class="info">
          <div class="name" id="pName">PLAYER NAME</div>
          <div class="dept" id="pDept">CIVILIAN</div>
        </div>
        <div class="time" id="pTime"></div>
      </div>
    </div>
  </section>
</div>

<script>
const $ = id => document.getElementById(id);

function clean(v, fallback){
  v = (v || '').trim();
  return v || fallback;
}

function updatePreview(){
  $('pName').textContent = clean($('player').value,'PLAYER NAME');
  $('pDept').textContent = clean($('department').value,'CIVILIAN');
}

function updateClock(){
  const d = new Date();
  const date = d.toLocaleDateString(undefined,{year:'numeric',month:'2-digit',day:'2-digit'});
  const time = d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
  $('pTime').textContent = date + '  ' + time;
}

function makeURL(){
  const base = location.href.split('?')[0].split('#')[0];
  const params = new URLSearchParams();
  params.set('player',clean($('player').value,'PLAYER NAME'));
  params.set('department',clean($('department').value,'CIVILIAN'));
  return base + '?' + params.toString();
}

function generate(){
  $('url').textContent = makeURL();
}

async function copyURL(){
  const url = makeURL();
  $('url').textContent = url;
  try{
    await navigator.clipboard.writeText(url);
    $('copy').textContent = 'COPIED ✓';
    setTimeout(() => $('copy').textContent='COPY OBS URL',1500);
  }catch(e){
    const ta=document.createElement('textarea');
    ta.value=url; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
    $('copy').textContent='COPIED ✓';
    setTimeout(() => $('copy').textContent='COPY OBS URL',1500);
  }
}

function loadParams(){
  const q = new URLSearchParams(location.search);
  if(q.has('player')) $('player').value=q.get('player');
  if(q.has('department')) $('department').value=q.get('department');
  updatePreview();
  if(q.has('player') || q.has('department')) generate();
}

$('player').addEventListener('input',updatePreview);
$('department').addEventListener('input',updatePreview);
$('generate').addEventListener('click',generate);
$('copy').addEventListener('click',copyURL);

loadParams();
updateClock();
setInterval(updateClock,1000);
</script>
</body>
</html>
