<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MAVILIVE Bodycam</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#090909;color:#fff}
.page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:min(560px,100%);background:#111;border:1px solid #292929;border-radius:18px;padding:28px;box-shadow:0 20px 70px #000}
.logo{font-weight:900;font-size:30px;letter-spacing:2px}.logo span{color:#e50914}
h1{margin:8px 0 4px;font-size:26px}.sub{color:#999;margin-bottom:24px}
label{display:block;font-size:13px;color:#bbb;margin:15px 0 7px}
input{width:100%;padding:14px;border-radius:10px;border:1px solid #333;background:#191919;color:#fff;outline:none}
input:focus{border-color:#e50914}.btn{width:100%;padding:14px;border:0;border-radius:10px;background:#e50914;color:white;font-weight:800;cursor:pointer;margin-top:20px}
.btn:hover{background:#c90812}.error{color:#ff5962;font-size:13px;margin-top:8px}.hidden{display:none}
.result{margin-top:25px;border-top:1px solid #292929;padding-top:22px}.url{display:flex;gap:8px}.url input{font-size:12px}.copy{width:100px;background:#222;border:1px solid #444;color:#fff;border-radius:10px;font-weight:700;cursor:pointer}
.preview{margin-top:20px;border:1px solid #292929;border-radius:12px;padding:16px;background:#050505}
.small{font-size:12px;color:#888}.obs{margin-top:14px;color:#ccc;font-size:14px;line-height:1.6}
a{color:#ff4a52}
</style>
</head>
<body>
<div class="page">
<div class="card">
<div class="logo">MAVI<span>LIVE</span></div>
<h1>Bodycam Overlay</h1>
<div class="sub">Create a transparent FiveM bodycam overlay for OBS.</div>

<div id="setup">
<label>Player Name *</label>
<input id="player" maxlength="32" placeholder="Enter player name">
<label>Department (optional)</label>
<input id="department" maxlength="32" placeholder="e.g. LSPD, BCSO">
<div id="error" class="error"></div>
<button class="btn" onclick="createOverlay()">CREATE OVERLAY</button>
</div>

<div id="result" class="result hidden">
<div class="small">OBS Browser Source URL</div>
<div class="url">
<input id="overlayUrl" readonly>
<button class="copy" onclick="copyUrl()">COPY</button>
</div>
<div id="copyStatus" class="small"></div>

<div class="preview">
<strong>Overlay preview</strong>
<div class="obs">
🔴 REC &nbsp; <span id="timer">00:00:00</span><br>
MAVILIVE<br>
<span id="pName"></span> — <span id="pDept"></span><br>
<span id="dateTime"></span>
</div>
</div>

<button class="btn" onclick="editOverlay()">EDIT</button>
<div class="obs">In OBS: Add <b>Browser Source</b>, paste the URL above, and use a transparent background.</div>
</div>
</div>
</div>

<script>
let startedAt=Date.now(), timerInt, clockInt;
function createOverlay(){
 const p=document.getElementById('player').value.trim();
 if(!p){document.getElementById('error').textContent='Player Name is required.';return}
 const d=document.getElementById('department').value.trim() || 'CIVILIAN';
 const id=crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36);
 const data={player:p,department:d,startedAt:Date.now()};
 localStorage.setItem('mavilive_'+id,JSON.stringify(data));
 const base=location.href.split('?')[0].replace(/\/index\\.html$/,'/');
 const url=base+'overlay.html?id='+encodeURIComponent(id);
 document.getElementById('overlayUrl').value=url;
 document.getElementById('pName').textContent=p;
 document.getElementById('pDept').textContent=d;
 document.getElementById('setup').classList.add('hidden');
 document.getElementById('result').classList.remove('hidden');
 startPreview();
}
function startPreview(){
 startedAt=Date.now();
 clearInterval(timerInt);clearInterval(clockInt);
 timerInt=setInterval(updateTimer,1000);clockInt=setInterval(updateClock,1000);
 updateTimer();updateClock();
}
function updateTimer(){
 let s=Math.floor((Date.now()-startedAt)/1000),h=Math.floor(s/3600);s%=3600;
 let m=Math.floor(s/60);s%=60;
 document.getElementById('timer').textContent=[h,m,s].map(x=>String(x).padStart(2,'0')).join(':');
}
function updateClock(){document.getElementById('dateTime').textContent=new Date().toLocaleString();}
function copyUrl(){
 navigator.clipboard.writeText(document.getElementById('overlayUrl').value);
 document.getElementById('copyStatus').textContent='Copied!';
 setTimeout(()=>document.getElementById('copyStatus').textContent='',1500);
}
function editOverlay(){document.getElementById('result').classList.add('hidden');document.getElementById('setup').classList.remove('hidden')}
</script>
</body>
</html>
