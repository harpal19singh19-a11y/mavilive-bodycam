<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAVILIVE Bodycam URL Generator</title>
<style>
body{margin:0;min-height:100vh;background:#111;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center}.panel{width:min(520px,92vw);padding:28px;background:#1b1b1f;border:1px solid #444;border-radius:12px}h1{margin:0 0 6px}.sub{color:#aaa;margin-bottom:22px}label{display:block;font-size:12px;font-weight:800;letter-spacing:1px;margin:15px 0 7px}input{width:100%;padding:13px;border:1px solid #555;border-radius:6px;background:#0d0d10;color:#fff;font-size:15px}button{margin-top:18px;padding:12px 14px;border:0;border-radius:6px;font-weight:800;cursor:pointer;margin-right:8px}#generate{background:#fff;color:#111}#copy{background:#e22;color:#fff}.output{margin-top:18px;padding:12px;background:#0d0d10;border:1px solid #444;border-radius:6px;word-break:break-all;color:#ddd;font-size:13px}
</style></head><body><div class="panel"><h1>MAVILIVE BODYCAM</h1><div class="sub">OBS Bodycam URL Generator</div>
<label>PLAYER NAME</label><input id="player" placeholder="Mavi"><label>DEPARTMENT</label><input id="department" placeholder="Police (blank = CIVILIAN)">
<button id="generate">GENERATE OBS URL</button><button id="copy">COPY OBS URL</button><div class="output" id="out">Enter details and generate your OBS URL.</div></div>
<script>
const base=new URL("bodycam.html",location.href);
function make(){const u=new URL(base),p=document.getElementById("player").value.trim(),d=document.getElementById("department").value.trim();p?u.searchParams.set("player",p):u.searchParams.delete("player");d?u.searchParams.set("department",d):u.searchParams.delete("department");document.getElementById("out").textContent=u.href;return u.href}
generate.onclick=make;copy.onclick=async()=>{const u=make();try{await navigator.clipboard.writeText(u);copy.textContent="COPIED ✓";setTimeout(()=>copy.textContent="COPY OBS URL",1400)}catch(e){prompt("Copy this OBS URL:",u)}};
</script></body></html>
