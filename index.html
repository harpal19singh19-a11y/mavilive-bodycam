<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BODYCAM BY MAVILIVE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: #0a0a0a;
  color: #fff;
  font-family: "Roboto Condensed", Arial, sans-serif;
}

body {
  min-height: 100vh;
  overflow-x: hidden;
}

/* =========================
   CENTER GENERATOR
========================= */

.page-center {
  position: fixed;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 100%;
  display: flex;
  justify-content: center;
  padding: 20px;
  z-index: 100;
}

.generator {
  width: min(560px, 100%);
  background: #151515;
  border: 1px solid #333;
  border-radius: 18px;
  padding: 28px;
  box-shadow:
    0 20px 60px rgba(0,0,0,.75),
    0 0 0 1px rgba(255,255,255,.02);
}

/* =========================
   HEADER
========================= */

.header {
  text-align: center;
  margin-bottom: 25px;
}

.header h1 {
  margin: 0;
  font-size: 30px;
  font-weight: 800;
  letter-spacing: 2px;
}

.header p {
  margin: 6px 0 0;
  color: #888;
  font-size: 14px;
  letter-spacing: 1px;
}

/* =========================
   FORM
========================= */

.field {
  margin-bottom: 18px;
}

.field label {
  display: block;
  margin-bottom: 7px;
  color: #aaa;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: .7px;
}

.field input {
  width: 100%;
  height: 48px;
  padding: 0 15px;

  border: 1px solid #3a3a3a;
  border-radius: 9px;

  outline: none;

  background: #0d0d0d;
  color: #fff;

  font-family: "Roboto Condensed", Arial, sans-serif;
  font-size: 17px;

  transition:
    border-color .2s,
    box-shadow .2s;
}

.field input:focus {
  border-color: #777;

  box-shadow:
    0 0 0 2px rgba(255,255,255,.05);
}

/* =========================
   BUTTONS
========================= */

.buttons {
  display: flex;
  gap: 10px;
  margin-top: 8px;
}

button {
  height: 48px;
  border: 0;
  border-radius: 9px;

  font-family: "Roboto Condensed", Arial, sans-serif;
  font-size: 16px;
  font-weight: 800;

  cursor: pointer;

  transition:
    transform .15s,
    opacity .15s;
}

button:hover {
  transform: translateY(-1px);
  opacity: .9;
}

button:active {
  transform: translateY(0);
}

.generate {
  flex: 1;
  background: #fff;
  color: #000;
}

.copy {
  width: 110px;
  background: #292929;
  color: #fff;
  border: 1px solid #444;
}

/* =========================
   URL BOX
========================= */

.url-box {
  margin-top: 18px;
}

.url-box label {
  display: block;
  margin-bottom: 7px;

  color: #aaa;
  font-size: 14px;
  font-weight: 700;
}

.url {
  width: 100%;
  min-height: 48px;

  padding: 13px 15px;

  background: #0c0c0c;
  border: 1px solid #333;
  border-radius: 9px;

  color: #aaa;

  font-family: monospace;
  font-size: 12px;

  word-break: break-all;
}

/* =========================
   PREVIEW
========================= */

.preview-title {
  margin-top: 25px;
  margin-bottom: 10px;

  color: #aaa;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: .7px;
}

.preview {
  position: relative;

  min-height: 130px;

  padding: 20px;

  border: 1px solid #333;
  border-radius: 10px;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.025),
      rgba(255,255,255,0)
    );

  overflow: hidden;
}

/* BODYCAM STYLE */

.bodycam-preview {
  position: relative;
  width: 100%;
  height: 90px;

  font-family: "Roboto Condensed", Arial, sans-serif;

  text-shadow:
    0 2px 3px rgba(0,0,0,.98),
    0 4px 8px rgba(0,0,0,.85),
    0 8px 15px rgba(0,0,0,.65);
}

.rec {
  position: absolute;
  top: 0;
  left: 0;

  font-size: 17px;
  font-weight: 800;
  letter-spacing: 1px;
}

.rec-dot {
  color: #ff1515;
  text-shadow:
    0 0 5px rgba(255,0,0,.9),
    0 2px 4px rgba(0,0,0,1);
}

.bodycam-title {
  position: absolute;
  top: 0;
  right: 0;

  font-size: 20px;
  font-weight: 800;
  letter-spacing: 1.5px;
}

.player-preview {
  position: absolute;
  left: 0;
  bottom: 29px;

  font-size: 15px;
  font-weight: 700;
  letter-spacing: .8px;
}

.job-preview {
  position: absolute;
  left: 0;
  bottom: 7px;

  font-size: 16px;
  font-weight: 800;
  letter-spacing: 1px;
}

.date-preview {
  position: absolute;
  right: 0;
  bottom: 7px;

  font-size: 13px;
  font-weight: 600;
  letter-spacing: .5px;
}

/* =========================
   INFO
========================= */

.info {
  margin-top: 18px;

  color: #777;

  text-align: center;

  font-size: 12px;
  line-height: 1.5;
}

/* =========================
   SOCIAL FOOTER
========================= */

.social-footer {
  position: fixed;

  left: 0;
  bottom: 10px;

  width: 100%;

  display: flex;
  justify-content: center;
  align-items: center;

  gap: 38px;

  z-index: 9999;
}

.social {
  display: flex;
  align-items: center;

  gap: 10px;

  color: #fff;
  text-decoration: none;

  font-family: "Roboto Condensed", Arial, sans-serif;

  font-size: 18px;
  font-weight: 800;

  letter-spacing: .7px;

  text-shadow:
    0 2px 3px rgba(0,0,0,.95),
    0 4px 8px rgba(0,0,0,.75);

  transition:
    transform .2s,
    opacity .2s;
}

.social:hover {
  transform: translateY(-2px) scale(1.03);
  opacity: .85;
}

.social svg {
  width: 27px;
  height: 27px;

  display: block;

  fill: currentColor;
}

.youtube svg {
  fill: #ff0000;
}

.youtube .play {
  fill: #fff;
}

.kick svg {
  fill: #53fc18;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

  .page-center {
    position: relative;
    left: auto;
    top: auto;
    transform: none;

    min-height: 100vh;

    padding: 20px;
    padding-bottom: 100px;
  }

  .generator {
    margin: auto;
    padding: 22px;
  }

  .header h1 {
    font-size: 25px;
  }

  .buttons {
    flex-direction: column;
  }

  .copy {
    width: 100%;
  }

  .social-footer {
    gap: 25px;
    bottom: 15px;
  }

  .social {
    font-size: 16px;
  }

  .social svg {
    width: 23px;
    height: 23px;
  }
}
</style>
</head>

<body>

<!-- =========================
     GENERATOR
========================= -->

<div class="page-center">

  <main class="generator">

    <div class="header">
      <h1>BODYCAM</h1>
      <p>BY MAVILIVE</p>
    </div>

    <div class="field">
      <label for="player">PLAYER NAME</label>

      <input
        id="player"
        type="text"
        placeholder="Enter player name"
        autocomplete="off"
      >
    </div>

    <div class="field">
      <label for="job">DEPARTMENT / JOB</label>

      <input
        id="job"
        type="text"
        value="Civilian"
        placeholder="Enter department"
        autocomplete="off"
      >
    </div>

    <div class="buttons">

      <button
        class="generate"
        id="generateBtn"
      >
        GENERATE OBS URL
      </button>

      <button
        class="copy"
        id="copyBtn"
      >
        COPY
      </button>

    </div>

    <div class="url-box">

      <label>OBS BROWSER SOURCE URL</label>

      <div
        class="url"
        id="generatedUrl"
      >
        Generate your OBS URL...
      </div>

    </div>

    <div class="preview-title">
      LIVE PREVIEW
    </div>

    <div class="preview">

      <div class="bodycam-preview">

        <div class="rec">
          <span class="rec-dot">●</span>
          REC
        </div>

        <div class="bodycam-title">
          BODYCAM
        </div>

        <div
          class="player-preview"
          id="pview"
        >
          PLAYER: —
        </div>

        <div
          class="job-preview"
          id="jview"
        >
          CIVILIAN
        </div>

        <div
          class="date-preview"
          id="dateview"
        >
          23/09/2026 10:00:00 PM
        </div>

      </div>

    </div>

    <div class="info">
      Use the generated URL as an OBS Browser Source.
      The URL does not expire.
    </div>

  </main>

</div>


<!-- =========================
     SOCIAL FOOTER
========================= -->

<footer class="social-footer">

  <!-- YOUTUBE -->

  <a
    href="#"
    class="social youtube"
    target="_blank"
    rel="noopener"
  >

    <svg
      viewBox="0 0 24 24"
      aria-hidden="true"
    >

      <path
        d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8z"
      />

      <path
        class="play"
        d="M9.6 15.5v-7l6 3.5-6 3.5z"
      />

    </svg>

    <span>Mavilive</span>

  </a>


  <!-- KICK -->

  <a
    href="#"
    class="social kick"
    target="_blank"
    rel="noopener"
  >

    <svg
      viewBox="0 0 24 24"
      aria-hidden="true"
    >

      <path
        d="M3 2h7v6l3-6h8l-6 10 6 10h-8l-3-6v6H3V2z"
      />

    </svg>

    <span>Maavilive</span>

  </a>

</footer>


<script>

/* =========================
   ELEMENTS
========================= */

const playerInput =
  document.getElementById("player");

const jobInput =
  document.getElementById("job");

const generatedUrl =
  document.getElementById("generatedUrl");

const playerView =
  document.getElementById("pview");

const jobView =
  document.getElementById("jview");

const dateView =
  document.getElementById("dateview");

const generateBtn =
  document.getElementById("generateBtn");

const copyBtn =
  document.getElementById("copyBtn");


/* =========================
   LIVE PREVIEW
========================= */

function updatePreview() {

  const player =
    playerInput.value.trim() || "—";

  const job =
    jobInput.value.trim() || "CIVILIAN";

  playerView.textContent =
    "PLAYER: " + player;

  jobView.textContent =
    job.toUpperCase();

}


/* =========================
   LIVE CLOCK
========================= */

function updateClock() {

  const now = new Date();

  const day =
    String(now.getDate()).padStart(2, "0");

  const month =
    String(now.getMonth() + 1).padStart(2, "0");

  const year =
    now.getFullYear();

  let hours =
    now.getHours();

  const minutes =
    String(now.getMinutes()).padStart(2, "0");

  const seconds =
    String(now.getSeconds()).padStart(2, "0");

  const ampm =
    hours >= 12 ? "PM" : "AM";

  hours =
    hours % 12 || 12;

  dateView.textContent =
    `${day}/${month}/${year} ${hours}:${minutes}:${seconds} ${ampm}`;
}


/* =========================
   GENERATE URL
========================= */

function generateOBSUrl() {

  const player =
    playerInput.value.trim() || "Player";

  const job =
    jobInput.value.trim() || "Civilian";

  const params =
    new URLSearchParams({
      player: player,
      job: job.toUpperCase()
    });

  const url =
    new URL(
      "/overlay.html?" + params.toString(),
      window.location.origin
    ).href;

  generatedUrl.textContent =
    url;

}


/* =========================
   COPY URL
========================= */

async function copyURL() {

  const url =
    generatedUrl.textContent.trim();

  if (
    !url ||
    url === "Generate your OBS URL..."
  ) {
    return;
  }

  try {

    await navigator.clipboard.writeText(url);

    copyBtn.textContent = "COPIED!";

    setTimeout(() => {
      copyBtn.textContent = "COPY";
    }, 1500);

  } catch (error) {

    const textarea =
      document.createElement("textarea");

    textarea.value = url;

    document.body.appendChild(textarea);

    textarea.select();

    document.execCommand("copy");

    textarea.remove();

    copyBtn.textContent = "COPIED!";

    setTimeout(() => {
      copyBtn.textContent = "COPY";
    }, 1500);

  }

}


/* =========================
   EVENTS
========================= */

playerInput.addEventListener(
  "input",
  updatePreview
);

jobInput.addEventListener(
  "input",
  updatePreview
);

generateBtn.addEventListener(
  "click",
  generateOBSUrl
);

copyBtn.addEventListener(
  "click",
  copyURL
);


/* =========================
   START
========================= */

updatePreview();
updateClock();

setInterval(
  updateClock,
  1000
);

</script>

</body>
</html>
